name: GATE 0 data integrity

on:
  pull_request:
  push:
    branches: [main, 'feat/aos-gate0-data-integrity']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          for file in *.js *.mjs; do node --check "$file"; done
      - name: Synthetic storage and Google Sheets protocol tests
        run: node tests/gate0.test.cjs
      - name: Whitespace errors
        run: git show --format= --check HEAD

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned browser test tools
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Synthetic PWA browser checks
        env:
          PYTHONUNBUFFERED: '1'
        run: python tests/gate0-browser.py
