services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: alexander, POSTGRES_PASSWORD: alexander, POSTGRES_DB: alexander_ai }
    ports: ["5432:5432"]
    volumes: ["alexander_ai_pg:/var/lib/postgresql/data"]
  api:
    build: .
    env_file: .env
    command: ["node","backend/dist/server.js"]
    ports: ["3000:3000"]
    depends_on: [postgres]
  worker:
    build: .
    env_file: .env
    command: ["node","backend/dist/worker.js"]
    depends_on: [postgres]
volumes: { alexander_ai_pg: {} }

