services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: alexander, POSTGRES_PASSWORD: alexander, POSTGRES_DB: alexander_ai }
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["alexander_ai_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alexander -d alexander_ai"]
      interval: 5s
      timeout: 5s
      retries: 12
  migrate:
    build: .
    env_file: .env
    environment: &database
      DATABASE_URL: postgresql://alexander:alexander@postgres:5432/alexander_ai
      DATABASE_SSL: "false"
    command: ["node","backend/dist/migrate.js"]
    depends_on:
      postgres: { condition: service_healthy }
  api:
    build: .
    env_file: .env
    environment: *database
    command: ["node","backend/dist/server.js"]
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
  worker:
    build: .
    env_file: .env
    environment: *database
    command: ["node","backend/dist/worker.js"]
    depends_on:
      migrate: { condition: service_completed_successfully }
volumes: { alexander_ai_pg: {} }
