databases:
  - name: alexander-ai-db
    plan: 0.1c-256mb
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: alexander_ai
    user: alexander_ai
    ipAllowList: []
services:
  - type: web
    name: alexander-ai-api
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    preDeployCommand: node backend/dist/migrate.js
    envVars:
      - { key: DATABASE_URL, fromDatabase: { name: alexander-ai-db, property: connectionString } }
      - { key: DATABASE_SSL, value: render-internal }
      - { key: NODE_ENV, value: production }
      - { key: TELEGRAM_BOT_TOKEN, sync: false }
      - { key: TELEGRAM_ALLOWED_USER_ID, sync: false }
      - { key: TELEGRAM_WEBHOOK_SECRET, generateValue: true }
      - { key: AI_SYNC_TOKEN, generateValue: true }
      - { key: PUBLIC_BASE_URL, sync: false }
  - type: worker
    name: alexander-ai-worker
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerCommand: node backend/dist/worker.js
    preDeployCommand: node backend/dist/migrate.js
    envVars:
      - { key: DATABASE_URL, fromDatabase: { name: alexander-ai-db, property: connectionString } }
      - { key: DATABASE_SSL, value: render-internal }
      - { key: NODE_ENV, value: production }
      - { key: OPENAI_API_KEY, sync: false }
      - { key: OPENAI_MODEL, value: gpt-5-mini }
      - { key: OPENAI_DAILY_REQUEST_LIMIT, value: "20" }
      - { key: TELEGRAM_BOT_TOKEN, sync: false }
      - { key: TELEGRAM_ALLOWED_USER_ID, sync: false }
      - { key: TELEGRAM_WEBHOOK_SECRET, fromService: { name: alexander-ai-api, type: web, envVarKey: TELEGRAM_WEBHOOK_SECRET } }
      - { key: AI_SYNC_TOKEN, fromService: { name: alexander-ai-api, type: web, envVarKey: AI_SYNC_TOKEN } }
      - { key: TIMEZONE, value: Europe/Moscow }
      - { key: DAILY_BRIEF_HOUR, value: "8" }
